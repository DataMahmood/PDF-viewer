name: Publish v1.0.0 Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release source
        uses: actions/checkout@v4

      - name: Create release and attach standalone HTML
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = 'v1.0.0';
            const assetName = 'Kaghaz-PDF-Viewer-v1.0.0.html';
            const body = [
              '## Kaghaz PDF Viewer v1.0.0',
              '',
              'Initial standalone release of the browser-based PDF annotation reader.',
              '',
              '### Included',
              '- Local PDF rendering with PDF.js',
              '- Rectangle highlighting',
              '- Freehand drawing and pen annotations',
              '- Persian, Arabic, and English notes',
              '- Select, move, recolor, edit, and delete annotations',
              '- Eraser, undo, and redo',
              '- JSON backup and restore',
              '- Annotated PDF export',
              '- Font-rendering fallback for difficult embedded fonts',
              '',
              '### Download',
              'Download the standalone HTML file from the release assets.'
            ].join('\n');

            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'refs/tags/' + tag,
                sha: context.sha
              });
              release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: 'Kaghaz PDF Viewer v1.0.0',
                body,
                draft: false,
                prerelease: false
              });
            }

            const assets = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id
            });
            const oldAsset = assets.data.find(asset => asset.name === assetName);
            if (oldAsset) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: oldAsset.id
              });
            }

            const file = fs.readFileSync('index.html');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: assetName,
              data: file
            });